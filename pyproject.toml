[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powerpoint-mcp"
version = "0.1.0"
description = "Deterministic PowerPoint MCP Server for inspection, editing, rendering, and validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "lxml>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
powerpoint-mcp = "powerpoint_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
